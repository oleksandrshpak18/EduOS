<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tile1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="tile2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="tile3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="tile4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <filter id="tileGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Fluent OS 4-Tile Grid -->
  <g filter="url(#tileGlow)">
    <rect x="6" y="6" width="24" height="24" rx="5" fill="url(#tile1)"/>
    <rect x="34" y="6" width="24" height="24" rx="5" fill="url(#tile2)"/>
    <rect x="6" y="34" width="24" height="24" rx="5" fill="url(#tile3)"/>
    <rect x="34" y="34" width="24" height="24" rx="5" fill="url(#tile4)"/>
  </g>

  <!-- Educational Emblem / Graduation Cap Overlay -->
  <path d="M32 14l16 8-16 8-16-8z" fill="#ffffff" opacity="0.95"/>
  <path d="M22 25.5v5.5c0 3 4.5 5.5 10 5.5s10-2.5 10-5.5v-5.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <path d="M46 24.5v9" fill="none" stroke="#fcd34d" stroke-width="2" stroke-linecap="round"/>
  <circle cx="46" cy="34.5" r="1.5" fill="#fcd34d"/>
</svg>
