<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="netShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Central Cloud / Server Node -->
  <circle cx="24" cy="14" r="9" fill="url(#cloudGrad)" filter="url(#netShadow)"/>
  <ellipse cx="24" cy="14" rx="5" ry="9" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
  <line x1="15" y1="14" x2="33" y2="14" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>

  <!-- Network Bus Lines -->
  <line x1="24" y1="23" x2="24" y2="29" stroke="#64748b" stroke-width="2.5"/>
  <line x1="12" y1="29" x2="36" y2="29" stroke="#64748b" stroke-width="2.5"/>
  <line x1="12" y1="29" x2="12" y2="33" stroke="#64748b" stroke-width="2.5"/>
  <line x1="36" y1="29" x2="36" y2="33" stroke="#64748b" stroke-width="2.5"/>

  <!-- Workstation Left -->
  <rect x="6" y="33" width="12" height="9" rx="1.5" fill="#334155" filter="url(#netShadow)"/>
  <rect x="8" y="35" width="8" height="5" rx="1" fill="#38bdf8"/>
  <rect x="9" y="42" width="6" height="2" fill="#64748b"/>

  <!-- Workstation Right -->
  <rect x="30" y="33" width="12" height="9" rx="1.5" fill="#334155" filter="url(#netShadow)"/>
  <rect x="32" y="35" width="8" height="5" rx="1" fill="#38bdf8"/>
  <rect x="33" y="42" width="6" height="2" fill="#64748b"/>
</svg>
