<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="docCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="docShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Blue Cover Background -->
  <rect x="7" y="5" width="30" height="38" rx="4" fill="url(#docCover)" filter="url(#docShadow)"/>

  <!-- Paper Sheet -->
  <path d="M10 8h24v32H10z" fill="url(#paperGrad)"/>

  <!-- Folded Corner / Header Accent -->
  <rect x="10" y="8" width="24" height="6" fill="#e0f2fe"/>
  <circle cx="14" cy="11" r="1.5" fill="#0284c7"/>
  <circle cx="19" cy="11" r="1.5" fill="#0284c7"/>
  <circle cx="24" cy="11" r="1.5" fill="#0284c7"/>

  <!-- Text Lines -->
  <rect x="14" y="18" width="16" height="2" rx="1" fill="#94a3b8"/>
  <rect x="14" y="23" width="16" height="2" rx="1" fill="#94a3b8"/>
  <rect x="14" y="28" width="12" height="2" rx="1" fill="#94a3b8"/>
  <rect x="14" y="33" width="14" height="2" rx="1" fill="#94a3b8"/>

  <!-- Pencil / Pen across bottom-right -->
  <g transform="translate(4, 0)">
    <path d="M30 18l7 7-13 13-7-2 2-7z" fill="url(#penGrad)" filter="url(#docShadow)"/>
    <path d="M17 36l-2 5 5-2z" fill="#fcd34d"/>
    <path d="M15 41l-1 1 1-1z" fill="#0f172a"/>
    <path d="M34 14l3 3-2 2-3-3z" fill="#ef4444"/>
  </g>
</svg>
