<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="editBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="editShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Drafting Blueprint Square -->
  <rect x="6" y="6" width="36" height="36" rx="6" fill="url(#editBg)" filter="url(#editShadow)"/>

  <!-- Ruler Grid Marks -->
  <line x1="12" y1="6" x2="12" y2="10" stroke="#fecaca" stroke-width="1.5"/>
  <line x1="18" y1="6" x2="18" y2="12" stroke="#fecaca" stroke-width="1.5"/>
  <line x1="24" y1="6" x2="24" y2="10" stroke="#fecaca" stroke-width="1.5"/>
  <line x1="30" y1="6" x2="30" y2="12" stroke="#fecaca" stroke-width="1.5"/>
  <line x1="36" y1="6" x2="36" y2="10" stroke="#fecaca" stroke-width="1.5"/>

  <!-- Drafting Compass / Triangle & Pencil -->
  <path d="M14 34l18-18 4 4-18 18-5 1 1-5z" fill="#ffffff"/>
  <path d="M29 19l3 3" stroke="#b91c1c" stroke-width="1.5"/>
  <polygon points="13,35 15,31 17,33" fill="#fcd34d"/>
  <circle cx="13" cy="35" r="1" fill="#0f172a"/>

  <!-- Gear Badge in Top Corner -->
  <circle cx="34" cy="34" r="5" fill="#fef08a"/>
  <circle cx="34" cy="34" r="2" fill="#b91c1c"/>
</svg>
