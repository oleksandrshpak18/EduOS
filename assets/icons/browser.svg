<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="globeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Globe Base -->
  <circle cx="24" cy="24" r="18" fill="url(#globeGrad)" filter="url(#globeShadow)"/>

  <!-- Latitude / Longitude lines -->
  <ellipse cx="24" cy="24" rx="9" ry="18" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="24" cy="24" rx="18" ry="8" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.6"/>
  <line x1="6" y1="24" x2="42" y2="24" stroke="#e0f2fe" stroke-width="1.5" opacity="0.8"/>
  <line x1="24" y1="6" x2="24" y2="42" stroke="#e0f2fe" stroke-width="1.5" opacity="0.8"/>

  <!-- Swirling Orbit / Speed Ring -->
  <path d="M7 32C12 42 36 44 41 26c2-7-2-15-10-18" fill="none" stroke="url(#orbitGrad)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="31" cy="8" r="2.5" fill="#fcd34d"/>
</svg>
