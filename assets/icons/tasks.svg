<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="taskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="taskShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Performance Monitor Display -->
  <rect x="5" y="7" width="38" height="34" rx="4" fill="url(#taskBg)" stroke="#334155" stroke-width="1.5" filter="url(#taskShadow)"/>

  <!-- Grid lines -->
  <line x1="5" y1="18" x2="43" y2="18" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="5" y1="28" x2="43" y2="28" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="18" y1="7" x2="18" y2="41" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="30" y1="7" x2="30" y2="41" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 2"/>

  <!-- Telemetry Pulse Wave -->
  <path d="M7 26h8l3-12 5 20 4-13 3 5h11" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Performance Meter Bar at bottom -->
  <rect x="9" y="34" width="30" height="3" rx="1.5" fill="#334155"/>
  <rect x="9" y="34" width="20" height="3" rx="1.5" fill="#38bdf8"/>
</svg>
