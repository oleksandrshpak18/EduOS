<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="paletteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="brushWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Artist Palette Body -->
  <path d="M24 5C13.5 5 5 13.5 5 24c0 10.5 8 19 18.5 19 3 0 5-2 5-4.5 0-1.2-.5-2.2-1.2-3-.7-.8-1.2-1.8-1.2-2.9 0-2.3 1.9-4.2 4.2-4.2H33c6.6 0 12-5.4 12-12C45 10.4 35.6 5 24 5z" fill="url(#paletteGrad)" filter="url(#iconShadow)"/>

  <!-- Color Blobs -->
  <circle cx="14" cy="16" r="3.5" fill="#ef4444"/>
  <circle cx="23" cy="12" r="3.5" fill="#f59e0b"/>
  <circle cx="33" cy="15" r="3.5" fill="#10b981"/>
  <circle cx="13" cy="26" r="3.5" fill="#3b82f6"/>
  <circle cx="19" cy="34" r="3.5" fill="#8b5cf6"/>

  <!-- Thumb Hole -->
  <ellipse cx="37" cy="26" rx="3.5" ry="4" fill="#0f172a" opacity="0.2"/>

  <!-- Paintbrush -->
  <g transform="rotate(45 32 32)">
    <!-- Handle -->
    <path d="M30 6h4v20h-4z" fill="url(#brushWood)" rx="1.5"/>
    <!-- Metal Ferrule -->
    <path d="M29 25h6v7h-6z" fill="#94a3b8" rx="0.5"/>
    <!-- Bristles -->
    <path d="M29 32c0 4 3 8 3 8s3-4 3-8z" fill="#3b82f6"/>
  </g>
</svg>
