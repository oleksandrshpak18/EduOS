<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="learnBook" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="learnShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Open Academic Book -->
  <path d="M6 14c4-2 11-2 18 1 7-3 14-3 18-1v23c-4-2-11-2-18 1-7-3-14-3-18-1V14z" fill="url(#learnBook)" filter="url(#learnShadow)"/>
  <path d="M8 15c4-2 10-2 16 1v21c-6-3-12-3-16-1V15z" fill="#f0fdfa"/>
  <path d="M24 16c6-3 12-3 16-1v21c-4-2-10-2-16 1V16z" fill="#ccfbf1"/>

  <!-- Lines of Text -->
  <line x1="11" y1="21" x2="21" y2="21" stroke="#0f766e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="11" y1="26" x2="21" y2="26" stroke="#0f766e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="11" y1="31" x2="18" y2="31" stroke="#0f766e" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Graduation Cap Floating on Top -->
  <path d="M24 5l14 6-14 6-14-6z" fill="#1e293b"/>
  <path d="M16 14v4c0 2 3.5 4 8 4s8-2 8-4v-4" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <path d="M36 12v6" stroke="#eab308" stroke-width="1.5"/>

  <!-- Golden Achievement Star Badge -->
  <circle cx="37" cy="34" r="7" fill="url(#starGrad)" filter="url(#learnShadow)"/>
  <path d="M37 29.5l1.5 3 3.5.5-2.5 2.5.6 3.5-3.1-1.6-3.1 1.6.6-3.5-2.5-2.5 3.5-.5z" fill="#713f12"/>
</svg>
